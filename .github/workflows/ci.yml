name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

# Use custom shell with -l so .bash_profile is sourced
# without having to do it in manually every step
defaults:
  run:
    shell: bash -leo pipefail {0}

# The jobs are split into:
# 1. a dependency build step (setup), and
# 2. a NEXUS build and test step (build)
# The setup is run once and the environment is cached,
# so each subsequent build and test of NEXUS can reuse the cached
# dependencies to save time (and compute).

jobs:
  setup:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, intel]
        esmf_version: ["8.8.0"]
    env:
      cache_key: ${{ matrix.compiler }}
    steps:
      - name: checkout  # this is to get the spack configuration
        uses: actions/checkout@v4
        with:
            submodules: true
            fetch-depth: 0

      # Cache spack, compiler and dependencies
      - name: cache-env
        id: cache-env
        uses: actions/cache@v3
        with:
          path: |
            spack
            ~/.spack
            ${{ matrix.compiler == 'intel' && '/opt/intel' || '' }}
          key: spack-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.esmf_version }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: install-intel-compilers
        if: matrix.compiler == 'intel'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/Intel-SW-Product-PUB.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/Intel-SW-Product-PUB.gpg arch=amd64] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install intel-oneapi-compiler-fortran intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic intel-oneapi-mkl intel-oneapi-mpi intel-oneapi-mpi-devel
          echo "source /opt/intel/oneapi/setvars.sh" >> ~/.bash_profile

      # Install dependencies using Spack
      - name: install-dependencies-with-spack
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          # Install Spack
          git clone -c feature.manyFiles=true https://github.com/spack/spack.git
          source spack/share/spack/setup-env.sh

          # Create spack environment for NEXUS from yaml file
          spack env create nexus-env $GITHUB_WORKSPACE/ci/spack.yaml
          spack env activate nexus-env

          # Configure to prefer binary packages when available
          spack config add "config:binary:package-cache:buildcache"

          # Install system dependencies needed for building
          sudo apt update
          sudo apt install -y cmake zlib1g-dev libxml2-dev pkg-config libssl-dev

          # Find and configure compilers
          spack compiler find
          spack external find

          # Configure Intel MPI as external package if using Intel compiler
          if [ "${{ matrix.compiler }}" = "intel" ]; then
            intel_mpi_version=$(basename $(realpath /opt/intel/oneapi/mpi/latest))
            spack config add "packages:mpi:require:intel-oneapi-mpi"
            sed -i "s|^  packages:|  packages:\n    intel-oneapi-mpi:\n      buildable: false\n      externals:\n      - spec: intel-oneapi-mpi@${intel_mpi_version}\n        prefix: /opt/intel/oneapi|" $SPACK_ENV/spack.yaml
          fi

          # Concretize to the specific ESMF version from the matrix
          spack concretize --force
          # Install dependencies in groups to avoid timeouts
          # Group 1: Basic system dependencies including zlib
          spack install --only dependencies --fail-fast cmake zlib
          # Group 2: Compression/IO libraries
          spack install --only dependencies --fail-fast xz bzip2 zstd libiconv libxml2
          # Group 3: Graphics/Utility libraries
          spack install --only dependencies --fail-fast libpng jasper util-macros
          # Group 4: MPI and related
          spack install --only dependencies --fail-fast openmpi hwloc libevent numactl pmix prrte openssh autoconf automake libtool m4 flex pkg-config
          # Group 5: HDF5 and NetCDF stack
          spack install --only dependencies --fail-fast hdf5 netcdf-c netcdf-fortran
          # Group 6: ParallelIO and ESMF
          spack install --only dependencies --fail-fast parallelio esmf@${{ matrix.esmf_version }}
          # Group 7: BACIO
          spack install --only dependencies --fail-fast bacio
          # Create build cache for faster subsequent builds
          spack buildcache push --allow-root --unsigned $HOME/spack-cache
          spack clean --all

  build:
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, intel]
        esmf_version: ["8.8.0"]
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
            submodules: true
            fetch-depth: 0

      - name: cache-env
        id: cache-env
        uses: actions/cache@v3
        with:
          path: |
            spack
            ~/.spack
            ${{ matrix.compiler == 'intel' && '/opt/intel' || '' }}
          key: spack-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.esmf_version }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: install-intel
        if: matrix.compiler == 'intel'
        run: |
          echo "source /opt/intel/oneapi/setvars.sh" >> ~/.bash_profile

      - name: build-nexus
        run: |
          source spack/share/spack/setup-env.sh
          spack env activate nexus-env

          # Install ESMF and its direct dependencies (which should already be built, but this ensures they are available)
          spack install --fail-fast esmf@${{ matrix.esmf_version }}

          # Source Intel MPI environment variables if using Intel compiler
          if [ "${{ matrix.compiler }}" = "intel" ]; then
            source /opt/intel/oneapi/mpi/latest/env/vars.sh
          fi

          # Set environment variables for CMake
          echo "ESMFMKFILE=$(spack location -i esmf)/lib/esmf.mk" >> "$GITHUB_ENV"

          # Configure and build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake -S . -B build -DCMAKE_Fortran_COMPILER=gfortran-12
          else
            source /opt/intel/oneapi/setvars.sh intel64
            cmake -S . -B build -DCMAKE_Fortran_COMPILER=ifx
          fi

          cmake --build build

      - name: run-test-cases
        run: |
          source spack/share/spack/setup-env.sh
          spack env activate nexus-env

          # Install ESMF and its direct dependencies (it might not be installed if cache was hit in build step)
          spack install --fail-fast esmf@${{ matrix.esmf_version }}

          set -x
          bin="$PWD/build/bin/nexus"
          failed=0
          cd tests/cases
          for d in *; do
            cd $d
            $bin -c NEXUS_Config.rc -r grid_spec.nc || failed=1
            if [[ "$failed" == 1 ]]; then
              tail -n 20 NEXUS.log
              cat PET0.ESMF_LogFile
              exit 1
            fi
            cd ..
          done
