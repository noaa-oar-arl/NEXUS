# Spack environment file to build NEXUS dependencies
spack:
  packages:
    all:
      compiler: [oneapi, gcc@12:12, apple-clang@14]
  specs:
  - jasper@2.0.32
  - libpng@1.6.37
  - hdf5@1.14.3
  - netcdf-c@4.9.2
  - netcdf-fortran@4.6.1
  - parallelio@2.6.2+fortran~pnetcdf
  - esmf@8.8.0+mpi
  - bacio@2.4.1
  view: true
  concretizer:
    unify: when_possible