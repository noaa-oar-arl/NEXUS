# Spack environment file to build NEXUS dependencies
spack:
  config:
    install_tree:
      padded_length: 128
  packages:
    all:
      target: [x86_64]
      compiler: gcc@12.3.0
    zlib:
      buildable: true
      externals: []
    pmix:
      variants: ~munge
  specs:
  - jasper@2.0.32
  - libpng@1.6.37
  - hdf5@1.14.3
  - netcdf-c@4.9.2
  - netcdf-fortran@4.6.1
  - parallelio@2.6.2+fortran~pnetcdf
  - esmf@8.8.0+mpi
  - bacio@2.4.1
  view: true
  concretizer:
    unify: when_possible
