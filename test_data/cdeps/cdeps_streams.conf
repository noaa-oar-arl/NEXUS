# CDEPS Stream Configuration for NEXUS Testing
# This file defines the streams that will be used for testing

[stream:emission_data]
# Basic stream configuration
name = emission_data
type = inline

# File paths (use sample data for testing)
meshfile = /workspace/test_data/mesh/test_mesh.nc
filenames = /workspace/test_data/cdeps/emission_sample.nc
fldlist = emission

# Mapping parameters (required for shr_strdata_init_from_inline)
mapalgo = bilinear
taxmode = extend
tintalgo = linear
offset = 0
dtlimit = 1.5

# Time configuration
yearfirst = 2019
yearlast = 2019
yearalign = 2019

# Data dimensions
lev_dimname = ""
